<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3X-UI Sub Theme cover</title>
<!-- Rendered to 3X-UI-Sub-Theme.png (1280x640) by tools/shoot-cover.ps1; serve the repo root, not docs/. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Vazirmatn:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: #070b14; color: #f1f5f9; font-family: Inter, 'Segoe UI', sans-serif; position: relative;
    background-image:
      radial-gradient(700px 460px at 8% 0%, rgba(6,182,212,.22), transparent 65%),
      radial-gradient(640px 420px at 100% 100%, rgba(16,185,129,.18), transparent 65%),
      radial-gradient(rgba(148,163,184,.13) 1px, transparent 1px);
    background-size: auto, auto, 26px 26px;
  }
  .left { position: absolute; left: 64px; top: 64px; width: 470px; }
  .logo { display: flex; align-items: center; gap: 16px; }
  .logo img { width: 64px; height: 64px; filter: drop-shadow(0 10px 26px rgba(6,182,212,.4)); }
  .kicker { font-size: 18px; font-weight: 700; color: #94a3b8; letter-spacing: .02em; }
  h1 { font-size: 64px; line-height: 1.02; font-weight: 800; letter-spacing: -.03em; margin-top: 34px; }
  h1 span { background: linear-gradient(135deg, #22d3ee, #34d399); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { font-size: 22px; line-height: 1.45; color: #cbd5e1; margin-top: 22px; }
  .fa { font-family: Vazirmatn, sans-serif; direction: rtl; text-align: left; font-size: 20px; color: #94a3b8; margin-top: 10px; unicode-bidi: plaintext; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 30px; }
  .chips span { padding: 6px 13px; border-radius: 999px; font-size: 15px; font-weight: 700; background: rgba(148,163,184,.1); border: 1px solid rgba(148,163,184,.2); color: #e2e8f0; }
  .chips span.hi { background: rgba(6,182,212,.16); border-color: rgba(6,182,212,.4); color: #22d3ee; }
  .shot { position: absolute; border-radius: 14px; box-shadow: 0 30px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(148,163,184,.22); background-repeat: no-repeat; background-size: cover; }
  .desk { left: 568px; top: 58px; width: 668px; height: 492px; background-image: url(../screenshots/desktop-dark-fa.png); background-position: top center; }
  .phone { left: 1020px; top: 250px; width: 206px; height: 372px; border-radius: 26px; border: 6px solid #1e293b; background-image: url(../screenshots/mobile-light-en.png); background-position: top center; }
</style>
</head>
<body>
  <div class="left">
    <div class="logo"><img src="../docs/img/logo.svg" alt=""><div class="kicker">for 3x-ui panels</div></div>
    <h1>3X-UI<br><span>Sub Theme</span></h1>
    <p class="tag">A modern one-file subscription page: usage ring, live status, one-tap app import, QR codes.</p>
    <p class="fa">صفحهٔ اشتراک مدرن و تک‌فایلی برای پنل 3x-ui</p>
    <div class="chips"><span class="hi">فارسی + English</span><span>Dark / Light</span><span>Mobile</span><span>No CDN</span></div>
  </div>
  <div class="shot desk"></div>
  <div class="shot phone"></div>
</body>
</html>
